plugins {
    id 'com.google.protobuf' version '0.9.4'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    implementation 'org.springframework.boot:spring-boot-starter-test'

    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    testImplementation 'org.mockito:mockito-core'

    // gRPC server
    implementation 'net.devh:grpc-server-spring-boot-starter:3.1.0.RELEASE'
    implementation 'net.devh:grpc-client-spring-boot-starter:3.1.0.RELEASE'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.25.3"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:1.62.2"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/grpc'
            srcDirs 'build/generated/source/proto/main/java'
        }
        proto {
            srcDir '../user-service/src/main/proto'
            srcDir '../stats-service/src/main/proto'
            srcDir '../clan-service/src/main/proto'
            srcDir '../event-service/src/main/proto'
        }
    }
}

test {
    useJUnitPlatform()
    // динамическая загрузка агентов для тестов
    jvmArgs '-XX:+EnableDynamicAgentLoading'
}

jar {
    enabled = false
}