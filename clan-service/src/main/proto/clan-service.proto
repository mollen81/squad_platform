syntax = "proto3";

package com.squad.clan.grpc;

option java_multiple_files = true;
option java_package = "com.squad.clan.grpc";


service ClanService {
  rpc GetClanWithMembers (GetClanRequest) returns (GetClanResponse);

  rpc CreateClan (CreateClanRequest) returns (CreateClanResponse);

  rpc ApplyToClan (ApplyToClanRequest) returns (ApplyToClanResponse);

  rpc ProcessAcceptance (ProcessAcceptanceRequest) returns (ProcessAcceptanceResponse);
}


message GetClanRequest {
  string clan_id = 1;
}

message GetClanResponse {
  string id = 1;
  string name = 2;
  string tag = 3;
  string description = 4;
  string requirements = 5;
  string avatar_url = 6;
  bool is_recruiting = 7;
  string status = 8;
  int32 total_elo = 9;
  int32 min_elo = 10;
  string created_at = 11;
  repeated ClanMemberDto members = 12;
}

message ClanMemberDto {
  string id = 1;
  string user_id = 2;
  string role = 3; // LEADER, MODERATOR, MEMBER
}


message CreateClanRequest {
  string leader_id = 1;
  string name = 2;
  string tag = 3;
  string description = 4;
  string requirements = 5;
  string avatar_url = 6;
}

message CreateClanResponse {
  string clan_id = 1;
  string message = 2;
}


message ApplyToClanRequest {
  string user_id = 1;
  string clan_id = 2;
  string social_link = 3;
  string experience_text = 4;
}

message ApplyToClanResponse {
  string application_id = 1;
  string message = 2;
}


message ProcessAcceptanceRequest {
  string applicationId = 1;
  string acceptorId = 2;
}

message ProcessAcceptanceResponse {
  ClanMemberDto newMember = 1;
  string message = 2;
}